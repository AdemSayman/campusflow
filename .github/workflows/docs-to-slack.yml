name: Docs to Slack

on:
  push:
    branches: [main]
    paths:
      - "docs/**"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: List changed docs
        id: docs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD -- 'docs/' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          lines=""
          for f in "${files[@]}"; do
            url="${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/${f}"
            lines+="• <${url}|${f}>"$'\n'
          done

          {
            echo "count=${#files[@]}"
            echo "lines<<EOF"
            printf "%s" "$lines"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post to Slack
        if: steps.docs.outputs.count != '0'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "CampusFlow docs güncellendi"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: CampusFlow doküman güncellemesi
              - type: section
                text:
                  type: mrkdwn
                  text: "*${{ github.actor }}* `docs/` altına değişiklik pushladı.\n\n${{ steps.docs.outputs.lines }}\nCommit: <${{ github.event.head_commit.url }}|${{ github.event.head_commit.message }}>"
